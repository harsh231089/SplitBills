<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#252b29">
  <title>Tabby - Split expenses, stay even</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <svg class="icon-sprite" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
    <symbol id="i-users" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2M16 3.1a4 4 0 0 1 0 7.8M22 21v-2a4 4 0 0 0-3-3.87"/><circle cx="10" cy="7" r="4"/></symbol>
    <symbol id="i-receipt" viewBox="0 0 24 24"><path d="M4 3v18l4-2 4 2 4-2 4 2V3H4ZM8 7h8M8 11h8M8 15h4"/></symbol>
    <symbol id="i-wallet" viewBox="0 0 24 24"><path d="M20 8V5a2 2 0 0 0-2-2H5a3 3 0 0 0 0 6h15v10a2 2 0 0 1-2 2H5a3 3 0 0 1-3-3V6M22 12h-5a2 2 0 0 0 0 4h5v-4Z"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2m3 0-1 14H6L5 6m5 4v6m4-6v6"/></symbol>
    <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></symbol>
    <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></symbol>
  </svg>

  <div class="app-shell">
    <aside class="sidebar">
      <a class="brand" href="#" aria-label="Tabby home"><span class="brand-mark"><span></span><span></span><span></span><span></span></span><span>tabby<span class="brand-dot">.</span></span></a>
      <div class="sidebar-label">WORKSPACE</div>
      <div class="nav-active"><svg class="icon"><use href="#i-grid"/></svg> Overview <span class="nav-indicator"></span></div>
      <div class="sidebar-heading"><span>YOUR GROUPS</span><button class="icon-button side-add" data-action="new-group" title="Create group" aria-label="Create group"><svg class="icon"><use href="#i-plus"/></svg></button></div>
      <nav id="group-nav" aria-label="Groups"></nav>
      <div class="sidebar-bottom"><div class="sidebar-note-icon"><svg class="icon"><use href="#i-wallet"/></svg></div><div><strong>All square, eventually.</strong><p>Good times are better<br>without the math.</p></div></div>
      <div class="local-label"><span class="local-dot"></span> PRIVATE GROUPS</div>
    </aside>

    <main class="main">
      <header class="topbar"><div class="breadcrumb">Workspace <svg class="icon"><use href="#i-chevron"/></svg> <span id="breadcrumb-group">Overview</span></div><div class="topbar-right"><span class="local-pill"><span></span> Connecting</span><button class="text-button" data-action="refresh" hidden>Refresh</button><button class="text-button" data-action="sign-out" hidden>Sign out</button><button class="button button-dark top-add" data-action="add-expense"><svg class="icon"><use href="#i-plus"/></svg> Add expense</button></div></header>
      <div id="storage-warning" class="storage-warning" role="alert" hidden></div>
      <div class="content" id="content"></div>
    </main>
  </div>

  <dialog id="modal"><div class="modal-header"><div><div class="eyebrow" id="modal-eyebrow">LET'S GET STARTED</div><h2 id="modal-title"></h2></div><button class="icon-button close-button" data-action="close-modal" aria-label="Close"><svg class="icon"><use href="#i-close"/></svg></button></div><div id="modal-body"></div></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="model.js"></script>
  <script src="app.js"></script>
</body>
</html>
